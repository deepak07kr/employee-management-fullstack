<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Employee Management System</h1>

    <div class="container">

        <h2>Add Employee</h2>

        <form id="employeeForm">

            <input
                type="text"
                id="name"
                placeholder="Name"
                required
            >

            <input
                type="text"
                id="roll_no"
                placeholder="Roll Number"
                required
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <button type="submit">
                Add Employee
            </button>

        </form>

        <h2>Employees</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Department</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTableBody">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
